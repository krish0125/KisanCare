<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Signup - KisanCare</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body class="login-page">

    <!-- Standalone Login Header -->
    <header style="justify-content: center; background: transparent; box-shadow: none;">
        <div class="logo" style="color: var(--dark-green); font-size: 2rem;">🌿 KisanCare</div>
    </header>

    <main class="container">
        <div class="auth-container card">
            <!-- Removed Top Toggle Buttons -->

            <!-- Login Form -->
            <form id="loginForm" class="auth-form">
                <h2>Welcome Back</h2>

                <!-- Login Method Toggle Removed from Top -->

                <div id="emailLoginGroup">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password">
                    </div>
                </div>

                <div id="phoneLoginGroup" style="display: none;">
                    <div class="form-group">
                        <label for="loginPhone">Phone Number</label>
                        <input type="tel" id="loginPhone" placeholder="Enter 10-digit number" pattern="[0-9]{10}">
                    </div>
                    <div class="form-group" id="otpGroup" style="display: none;">
                        <label for="loginOTP">OTP</label>
                        <input type="text" id="loginOTP" placeholder="Enter OTP">
                    </div>
                    <button type="button" id="sendOtpBtn" class="btn"
                        style="background: #e67e22; margin-bottom: 10px; width: 100%;">Send OTP</button>
                </div>

                <button type="submit" class="btn" style="width: 100%;">Login</button>

                <!-- Social Login -->
                <div style="margin-top: 20px; text-align: center;">
                    <p style="margin-bottom: 10px; font-size: 0.9rem; color: #666;">Or continue with:</p>

                    <button type="button" id="googleLoginBtn" class="social-btn google-btn">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="20">
                        Continue with Google
                    </button>

                    <div style="margin-top: 10px;">
                        <button type="button" id="phoneLoginLink"
                            style="background:none; border:none; color: #7f8c8d; cursor:pointer; text-decoration: underline;">
                            Login with Phone Number
                        </button>
                    </div>
                </div>

                <p style="margin-top: 15px; font-size: 0.9rem;">
                    Don't have an account? <a href="#" id="switchToSignup"
                        style="color: var(--primary-green); font-weight: bold; text-decoration: none;">Sign Up</a>
                </p>
            </form>

            <!-- Mock Google Sign-In Popup -->
            <div id="googleModal" class="google-modal-overlay" style="display: none;">
                <div class="google-modal-content">
                    <div class="google-header">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="24">
                        <span>Sign in with Google</span>
                    </div>
                    <div class="google-body">
                        <h3>Choose an account</h3>
                        <p>to continue to KisanCare</p>

                        <div class="account-list">
                            <div class="account-item" onclick="handleGoogleSelect('demo@gmail.com', 'Demo User')">
                                <div class="avatar" style="background: #ef5350;">D</div>
                                <div class="account-info">
                                    <span class="name">Demo User</span>
                                    <span class="email">demo@gmail.com</span>
                                </div>
                            </div>
                            <div class="account-item" onclick="handleGoogleSelect('user2@example.com', 'User Two')">
                                <div class="avatar" style="background: #4285f4;">U</div>
                                <div class="account-info">
                                    <span class="name">User Two</span>
                                    <span class="email">user2@example.com</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="google-footer">
                        <button onclick="closeGoogleModal()">Cancel</button>
                    </div>
                </div>
            </div>

            <!-- Welcome Modal -->
            <div id="welcomeModal" class="google-modal-overlay" style="display: none; z-index: 2100;">
                <div class="google-modal-content" style="text-align: center; padding: 40px; width: 350px;">
                    <div style="font-size: 3rem; margin-bottom: 20px;">🎉</div>
                    <h2 style="color: var(--dark-green); margin-bottom: 10px;">Welcome Back!</h2>
                    <h3 id="welcomeUserName" style="color: #555; font-weight: 500;">User</h3>
                    <p style="color: #888; margin-top: 15px;">Redirecting to dashboard...</p>
                    <div class="loading-spinner"
                        style="border: 4px solid #f3f3f3; border-top: 4px solid var(--primary-green); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto 0;">
                    </div>
                </div>
            </div>

            <style>
                @keyframes spin {
                    0% {
                        transform: rotate(0deg);
                    }

                    100% {
                        transform: rotate(360deg);
                    }
                }
            </style>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form" style="display: none;">
                <h2>Create Account</h2>
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="signupEmail">Email</label>
                    <input type="email" id="signupEmail" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="signupPhone">Phone Number</label>
                    <input type="tel" id="signupPhone" placeholder="Enter 10-digit number" pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="Create a password" required>
                </div>
                <div class="form-group">
                    <label for="signupConfirmPassword">Confirm Password</label>
                    <input type="password" id="signupConfirmPassword" placeholder="Confirm your password" required>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Sign Up</button>
                <p style="margin-top: 15px; font-size: 0.9rem;">
                    Already have an account? <a href="#" id="switchToLogin"
                        style="color: var(--primary-green); font-weight: bold; text-decoration: none;">Login</a>
                </p>
            </form>
        </div>
    </main>

    <script src="js/app.js"></script>
    <script>
        // Additional inline script for this specific page toggle logic
        document.addEventListener('DOMContentLoaded', () => {
            // const loginBtn = document.getElementById('loginBtn'); // Removed
            // const signupBtn = document.getElementById('signupBtn'); // Removed
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');

            // Login Method Toggles
            const loginMethods = document.getElementsByName('loginMethod');
            const emailLoginGroup = document.getElementById('emailLoginGroup');
            const phoneLoginGroup = document.getElementById('phoneLoginGroup');

            // OTP Logic
            const sendOtpBtn = document.getElementById('sendOtpBtn');
            const otpGroup = document.getElementById('otpGroup');
            let generatedOtp = null;

            // Toggle Login/Signup
            // Toggle Login/Signup
            const switchToSignup = document.getElementById('switchToSignup');
            const switchToLogin = document.getElementById('switchToLogin');

            if (switchToSignup && switchToLogin) {
                switchToSignup.addEventListener('click', (e) => {
                    e.preventDefault();
                    loginForm.style.display = 'none';
                    signupForm.style.display = 'block';
                });

                switchToLogin.addEventListener('click', (e) => {
                    e.preventDefault();
                    loginForm.style.display = 'block';
                    signupForm.style.display = 'none';
                });
            }

            // Google Login Logic
            const googleLoginBtn = document.getElementById('googleLoginBtn');
            const googleModal = document.getElementById('googleModal');
            const welcomeModal = document.getElementById('welcomeModal');
            const phoneLoginLink = document.getElementById('phoneLoginLink');

            if (googleLoginBtn) {
                googleLoginBtn.addEventListener('click', () => {
                    googleModal.style.display = 'flex';
                });
            }

            // Global function for modal account selection (needs to be attached to window for onclick in HTML)
            window.handleGoogleSelect = (email, name) => {
                const user = {
                    name: name,
                    email: email,
                    loggedInAt: new Date().toISOString(),
                    provider: 'google'
                };
                localStorage.setItem('kisanUser', JSON.stringify(user));

                // Hide Google Modal
                googleModal.style.display = 'none';

                // Show Welcome Modal
                if (welcomeModal) {
                    document.getElementById('welcomeUserName').innerText = name;
                    welcomeModal.style.display = 'flex';

                    // Redirect after 2 seconds
                    setTimeout(() => {
                        window.location.href = 'home.html';
                    }, 2000);
                } else {
                    // Fallback if modal missing
                    alert(`Welcome back, ${name}!`);
                    window.location.href = 'home.html';
                }
            }

            window.closeGoogleModal = () => {
                googleModal.style.display = 'none';
            }

            // Switch to Phone Login (Toggle visibility manually since we removed the radio buttons)
            if (phoneLoginLink) {
                phoneLoginLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    // Just toggle the groups manually for now as we removed the radio logic control
                    const emailGroup = document.getElementById('emailLoginGroup');
                    const phoneGroup = document.getElementById('phoneLoginGroup');

                    if (phoneGroup.style.display === 'none') {
                        emailGroup.style.display = 'none';
                        phoneGroup.style.display = 'block';
                        phoneLoginLink.innerText = "Login with Email";
                        document.getElementById('loginPhone').setAttribute('required', 'true');
                        document.getElementById('loginEmail').removeAttribute('required');
                    } else {
                        emailGroup.style.display = 'block';
                        phoneGroup.style.display = 'none';
                        phoneLoginLink.innerText = "Login with Phone Number";
                        document.getElementById('loginEmail').setAttribute('required', 'true');
                        document.getElementById('loginPhone').removeAttribute('required');
                    }
                });
            }

            // Send OTP Mock
            if (sendOtpBtn) {
                sendOtpBtn.addEventListener('click', () => {
                    const phone = document.getElementById('loginPhone').value;
                    if (!phone || phone.length !== 10) {
                        alert("Please enter a valid 10-digit phone number.");
                        return;
                    }

                    // Generate Mock OTP
                    generatedOtp = Math.floor(1000 + Math.random() * 9000);
                    alert(`Your OTP is: ${generatedOtp}`);

                    otpGroup.style.display = 'block';
                    document.getElementById('loginOTP').setAttribute('required', 'true');
                    sendOtpBtn.innerText = "Resend OTP";
                });
            }

            // Handle Login Submit
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();

                const method = document.querySelector('input[name="loginMethod"]:checked').value;
                let userIdentifier = '';

                if (method === 'email') {
                    userIdentifier = document.getElementById('loginEmail').value;
                    const password = document.getElementById('loginPassword').value;
                    if (!password) { alert("Please enter password"); return; }
                } else {
                    userIdentifier = document.getElementById('loginPhone').value;
                    const otpInput = document.getElementById('loginOTP').value;
                    if (parseInt(otpInput) !== generatedOtp) {
                        alert("Invalid OTP! Please try again.");
                        return;
                    }
                }

                // Mock user object
                const user = {
                    name: "User " + userIdentifier,
                    email: userIdentifier,
                    loggedInAt: new Date().toISOString()
                };

                localStorage.setItem('kisanUser', JSON.stringify(user));

                alert('Login Successful!');
                window.location.href = 'home.html';
            });

            // Handle Signup Submit
            signupForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('signupName').value;
                const email = document.getElementById('signupEmail').value;
                const p1 = document.getElementById('signupPassword').value;
                const p2 = document.getElementById('signupConfirmPassword').value;

                if (p1 !== p2) {
                    alert('Passwords do not match!');
                    return;
                }

                const user = {
                    name: name,
                    email: email,
                    loggedInAt: new Date().toISOString()
                };

                localStorage.setItem('kisanUser', JSON.stringify(user));

                alert('Signup Successful!');
                window.location.href = 'home.html';
            });
        });
    </script>
</body>

</html>
