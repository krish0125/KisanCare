<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - KisanCare</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .admin-table th,
        .admin-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .admin-table th {
            background-color: var(--primary-green);
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <div class="logo">🌿 KisanCare Admin</div>
            <ul class="nav-links">
                <li><a href="home.html">Back to Home</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>📊 User Login History (MongoDB)</h2>
        <p>This data is fetched directly from your MongoDB database.</p>

        <button onclick="fetchHistory()" class="btn">🔄 Refresh Data</button>

        <table class="admin-table">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Email</th>
                    <th>Device</th>
                    <th>Version</th>
                </tr>
            </thead>
            <tbody id="logsBody">
                <tr>
                    <td colspan="4">Loading...</td>
                </tr>
            </tbody>
        </table>
    </main>

    <script>
        async function fetchHistory() {
            const tbody = document.getElementById('logsBody');
            tbody.innerHTML = '<tr><td colspan="4">Loading data from MongoDB...</td></tr>';

            try {
                // Fetch from our Python Backend
                const response = await fetch('http://localhost:5001/login-history');
                const result = await response.json();

                if (result.status === 'success') {
                    const data = result.data;

                    if (data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4">No records found in database.</td></tr>';
                        return;
                    }

                    let rows = '';
                    data.forEach(item => {
                        rows += `
                            <tr>
                                <td>${item.timestamp}</td>
                                <td><b>${item.email || 'N/A'}</b></td>
                                <td>${item.device || 'N/A'}</td>
                                <td>${item.version || 'N/A'}</td>
                            </tr>
                        `;
                    });
                    tbody.innerHTML = rows;
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" style="color:red">Error: ${result.error}</td></tr>`;
                }
            } catch (error) {
                console.error(error);
                tbody.innerHTML = `<tr><td colspan="4" style="color:red">Failed to connect to backend. Is it running?</td></tr>`;
            }
        }

        // Load on start
        fetchHistory();
    </script>
</body>

</html>
