<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Prices - KisanCare</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

    <header>
        <nav>
            <div class="logo">🌿 KisanCare</div>
            <div class="menu-toggle" id="mobile-menu">
                <span class="bar">☰</span>
            </div>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="crop.html">Crop Advisory</a></li>
                <li><a href="weather.html">Weather Alerts</a></li>
                <li><a href="market.html" data-lang="market_prices" class="active">Market Prices</a></li>
                <li><a href="fertilizer.html">🌱 Fertilizers</a></li>
                <li><a href="#" id="navFeedbackLink" data-lang="feedback_nav">Feedback</a></li>
                <li><a href="index.html" data-lang="login">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2 data-lang="market_header">Live Market Prices (Mandi Rates)</h2>
        <div class="card">
            <div class="form-group">
                <label for="marketCrop" data-lang="select_crop_label">Select Crop</label>
                <select id="marketCrop">
                    <option value="wheat">Wheat</option>
                    <option value="rice">Rice</option>
                    <option value="onion">Onion</option>
                    <option value="potato">Potato</option>
                    <option value="tomato">Tomato</option>
                </select>
            </div>
            <div class="form-group">
                <label for="marketName" data-lang="market_name_label">Market / APMC Name</label>
                <input type="text" id="marketName" placeholder="e.g. Nashik APMC">
            </div>
            <button id="getPriceBtn" class="btn" data-lang="get_prices_btn">Get Prices</button>
        </div>

        <div id="priceResult" class="card" style="display: none;">
            <h3 data-lang="price_list_title">Price List</h3>
            <table>
                <thead>
                    <tr>
                        <th data-lang="th_crop">Crop</th>
                        <th data-lang="th_market">Market</th>
                        <th data-lang="th_price">Price (per Quintal)</th>
                        <th data-lang="th_date">Date</th>
                    </tr>
                </thead>
                <tbody id="priceTableBody">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Chat Widget -->
    <div class="chat-btn" id="chat-toggle-btn">
        <span class="material-icons">chat</span>
    </div>
    <div class="chat-container" id="chat-container">
        <div class="chat-header">
            <span>Kisan AI Assistant</span>
            <span class="material-icons close-btn" id="close-chat">close</span>
        </div>
        <div class="chat-lang-bar">
            <label>🌐 Language:</label>
            <select id="chat-lang-select">
                <option value="en">🇬🇧 English</option>
                <option value="hi">🇮🇳 हिन्दी (Hindi)</option>
                <option value="gu">🇮🇳 ગુજરાતી (Gujarati)</option>
                <option value="mr">🇮🇳 मराठी (Marathi)</option>
                <option value="pa">🇮🇳 ਪੰਜਾਬੀ (Punjabi)</option>
                <option value="ta">🇮🇳 தமிழ் (Tamil)</option>
                <option value="te">🇮🇳 తెలుగు (Telugu)</option>
                <option value="bn">🇮🇳 বাংলা (Bengali)</option>
                <option value="kn">🇮🇳 ಕನ್ನಡ (Kannada)</option>
                <option value="ml">🇮🇳 മലయാളം (Malayalam)</option>
                <option value="or">🇮🇳 ଓଡ଼ିଆ (Odia)</option>
                <option value="ur">🇮🇳 اردو (Urdu)</option>
            </select>
        </div>
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                <p>Hello! Ask me about crop prices, fertilizers, or farming tips! 🌾</p>
            </div>
        </div>
        <div class="chat-input-area">
            <label for="chat-file-input" class="file-upload-label">
                <span class="material-icons">attach_file</span>
            </label>
            <input type="file" id="chat-file-input" accept="image/*" hidden>
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button id="voice-btn" class="voice-btn" title="Voice Input"><span class="material-icons">mic</span></button>
            <button id="send-btn"><span class="material-icons">send</span></button>
        </div>
    </div>
    <script src="js/app.js"></script>
    <script src="js/chat.js"></script>
</body>

</html>
